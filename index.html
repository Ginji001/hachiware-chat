<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハチワレ チャット">
<title>ハチワレ チャット（Logfare）</title>
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: light dark;
  --border: #e7e5e0;
  --panel: #f7f7f5;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --bg: #ffffff;
  --bubble: #eeece7;
  --code-bg: #f2f1ed;
  --composer-border: #e3e1dc;
  --notice-bg: #fff8e1;
  --notice-border: #f0dfa0;
  --error-bg: #fdecec;
  --error-border: #efc3c3;
  --hover: #eceae5;
  --active: #e7e5df;
  --chip-border: #ddd9d2;
  --on-dark: #ffffff;
  --projbar-bg: #eef2f7;
  --projbar-border: #cfdce8;
  --shadow: rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --border: #3a3a3a;
    --panel: #292929;
    --text: #ececec;
    --muted: #a3a3a3;
    --bg: #1f1f1f;
    --bubble: #333333;
    --code-bg: #2e2e2e;
    --composer-border: #3d3d3d;
    --notice-bg: #38311c;
    --notice-border: #6b5d2a;
    --error-bg: #402727;
    --error-border: #6e3a3a;
    --hover: #333333;
    --active: #3a3a3a;
    --chip-border: #444444;
    --on-dark: #1f1f1f;
    --projbar-bg: #26303a;
    --projbar-border: #3d4c5c;
    --shadow: rgba(0,0,0,.45);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column;
  font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg); color: var(--text); padding: 10px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.brand .sub { color: var(--muted); font-weight: 400; font-size: .8rem; }
#brandIcon { width: 32px; height: 32px; border-radius: 50%; background: var(--panel); }
button {
  font: inherit; cursor: pointer; border: 0; border-radius: 999px;
  background: var(--text); color: var(--on-dark); padding: 9px 16px;
}
button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
button:disabled { opacity: .45; cursor: default; }
#modelSelect {
  border: 0; background: transparent; color: var(--muted); font-size: .82rem;
  padding: 4px 2px; border-radius: 8px; max-width: 30vw; flex: none;
  text-overflow: ellipsis; cursor: pointer;
}
#settingsBtn { border: 0; font-size: 1.05rem; padding: 7px 10px; }
select, input, textarea {
  font: inherit; border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; background: var(--bg); color: var(--text);
}
.notice {
  max-width: 800px; width: calc(100% - 28px); margin: 8px auto 0;
  background: var(--notice-bg); border: 1px solid var(--notice-border);
  padding: 10px 14px; border-radius: 12px; font-size: .88rem;
}
main#thread {
  flex: 1; overflow-y: auto; padding: 18px 16px 20px;
  display: flex; flex-direction: column; gap: 18px;
  max-width: 800px; width: 100%; margin: 0 auto;
}
.msg { line-height: 1.75; font-size: .95rem; white-space: pre-wrap; word-break: break-word; }
.msg.user {
  align-self: flex-end; background: var(--bubble); color: var(--text);
  padding: 10px 16px; border-radius: 20px; border-bottom-right-radius: 6px; max-width: 85%;
}
.row-wrap { display: flex; gap: 10px; align-items: flex-start; }
.row-wrap .msg { flex: 1; }
.msg.assistant { background: transparent; padding: 2px 0; }
.msg.error { background: var(--error-bg); border: 1px solid var(--error-border); padding: 10px 14px; border-radius: 14px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; margin-top: 2px; background: var(--panel); }
.msg img.gen { max-width: 100%; border-radius: 16px; display: block; margin-top: 6px; }
.msg pre {
  background: #1f1f22; color: #f2f2f2; padding: 12px; border-radius: 12px;
  overflow-x: auto; white-space: pre; font-size: .82rem;
}
.msg .dl {
  display: inline-block; margin: 6px 4px 6px 0; background: var(--text); color: var(--on-dark);
  padding: 7px 14px; border-radius: 999px; font-size: .82rem; cursor: pointer; border: 0;
}
.msg code { background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.msg pre code { background: transparent; padding: 0; }
footer { background: var(--bg); padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); max-width: 800px; width: 100%; margin: 0 auto; }
#composer {
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--bg); border: 1px solid var(--composer-border); border-radius: 24px;
  padding: 4px 6px 4px 10px; box-shadow: 0 2px 10px var(--shadow);
}
#composer textarea { flex: 1; resize: none; border: 0; outline: none; padding: 3px 2px; background: transparent; font-size: 1rem; line-height: 1.4; max-height: 140px; overflow-y: auto; }
#sendBtn { width: 34px; height: 34px; border-radius: 50%; padding: 0; font-size: 1rem; flex: none; display: grid; place-items: center; }
.hint { color: var(--muted); font-size: .78rem; max-width: 800px; margin: 8px auto 0; text-align: center; }
dialog { border: 0; border-radius: 20px; padding: 0; max-width: 480px; width: 92%; box-shadow: 0 12px 40px rgba(0,0,0,.18); background: var(--bg); color: var(--text); }
.settings-box { padding: 22px; display: grid; gap: 12px; }
.settings-box input { width: 100%; }
.settings-box .row { display: flex; gap: 8px; justify-content: flex-end; }
.settings-box .hint { text-align: left; margin: 0; }
.typing { opacity: .55; }
#rail {
  position: fixed; left: 0; top: 0; bottom: 0; width: 52px; z-index: 41;
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px;
}
#rail button {
  background: transparent; color: var(--text); width: 38px; height: 38px; padding: 0;
  border-radius: 10px; font-size: 1.05rem; display: grid; place-items: center;
}
#rail button:hover { background: var(--hover); }
#rail .sp { flex: 1; }
#rail img { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: var(--panel); }
body { padding-left: 52px; }
#sidebar {
  position: fixed; top: 0; left: 52px; bottom: 0; width: min(300px, 85vw);
  background: var(--panel); border-right: 1px solid var(--border); z-index: 40;
  transform: translateX(-105%); transition: transform .2s;
  display: flex; flex-direction: column; padding: 16px 12px; gap: 12px;
}
#sidebar.open { transform: none; box-shadow: 2px 0 16px rgba(0,0,0,.12); }
#sidebar .side-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; padding: 0 4px; }
.side-item {
  background: transparent; color: var(--text); text-align: left; width: 100%;
  border-radius: 12px; padding: 10px 12px; font-size: .95rem;
  display: flex; gap: 10px; align-items: center;
}
.side-item:hover { background: var(--hover); }
#searchInput { width: 100%; border-radius: 10px; }
.side-foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 4px; }
.profile { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: .92rem; }
.profile img { width: 28px; height: 28px; border-radius: 50%; background: var(--panel); }
#convList { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; }
.conv { padding: 10px 12px; border-radius: 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: .92rem; }
.conv:hover { background: var(--hover); }
.conv.active { background: var(--active); font-weight: 600; }
.conv .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .d { color: var(--muted); font-size: .75rem; white-space: nowrap; }
.conv .del { background: transparent; color: var(--muted); padding: 2px 8px; }
.conv .del:hover { color: #c0392b; }
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 39; }
.side-sec { display: flex; justify-content: space-between; align-items: center; font-weight: 600; padding: 0 4px; margin-top: 6px; }
.side-sec button { padding: 4px 10px; }
#projectList { display: flex; flex-direction: column; gap: 4px; }
.conv .edit { background: transparent; color: var(--muted); padding: 2px 8px; }
#projInstr { width: 100%; min-height: 180px; resize: vertical; line-height: 1.6; }
#composer { flex-direction: column; align-items: stretch; }
.composer-row { display: flex; gap: 6px; align-items: flex-end; width: 100%; min-height: 36px; }
.composer-row #attachBtn, .composer-row #sendBtn { align-self: flex-end; margin-bottom: 1px; }
.composer-row #modelSelect { align-self: flex-end; margin-bottom: 5px; }
#attBar { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 2px 8px; }
.att-item { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px 8px; font-size: .85rem; }
.att-item img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
.att-item button { padding: 2px 7px; background: transparent; color: var(--muted); }
#attachBtn { font-size: 1.05rem; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; color: var(--muted); display: grid; place-items: center; flex: none; }
#attachBtn:disabled { opacity: .35; }
.att-wrap { margin-bottom: 6px; }
.att-img { max-width: 240px; max-height: 240px; border-radius: 12px; border: 1px solid var(--border); display: block; }
.att-chip { display: inline-block; background: var(--bg); border: 1px solid var(--chip-border); border-radius: 8px; padding: 3px 8px; font-size: .82rem; margin: 0 6px 4px 0; }
#projBar { background: var(--projbar-bg); border-color: var(--projbar-border); }
.danger { color: #c0392b !important; border-color: #e5b4b4 !important; }
@media (min-width: 1024px) {
  body { padding-left: 300px; }
  #rail { display: none; }
  #sidebar { transform: none; width: 300px; left: 0; }
  #sideCloseBtn { display: none; }
  #scrim { display: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><img id="brandIcon" src="icon-512.png" alt=""></div>
  <button id="settingsBtn" class="ghost" type="button" aria-label="設定" title="設定">⚙️</button>
</header>

<nav id="rail" aria-label="ショートカット">
  <button id="railMenu" type="button" title="サイドバーを開く・閉じる">☰</button>
  <button id="railNew" type="button" title="新しいチャット">✏️</button>
  <button id="railSearch" type="button" title="会話を検索">🔍</button>
  <button id="railProj" type="button" title="プロジェクト">📁</button>
  <span class="sp"></span>
  <button id="railSettings" type="button" title="設定">⚙️</button>
  <img id="railAvatar" src="icon-512.png" alt="ハチワレ" title="サイドバーを開く">
</nav>

<aside id="sidebar" aria-label="会話リスト">
  <div class="side-head"><span></span><button id="sideCloseBtn" class="ghost" type="button">✕</button></div>
  <button id="newChatBtn" class="side-item" type="button">✏️ 新しいチャット</button>
  <button id="searchBtn" class="side-item" type="button">🔍 会話を検索</button>
  <input id="searchInput" type="search" placeholder="会話を検索" hidden>
  <div class="side-sec"><span>プロジェクト</span><button id="newProjectBtn" class="ghost" type="button">＋ 追加</button></div>
  <div id="projectList"></div>
  <div class="side-sec"><span id="convHead">会話</span></div>
  <div id="convList"></div>
  <div class="side-foot">
    <button id="sideSettingsBtn" class="side-item" type="button">⚙️ 設定</button>
    <div class="profile"><img src="icon-512.png" alt="">ハチワレ</div>
  </div>
</aside>
<div id="scrim" hidden></div>

<p id="keyNotice" class="notice" hidden>APIキーが未設定です。「⚙️ 設定」からキーを入れてください。</p>
<p id="autoNotice" class="notice" hidden></p>
<p id="projBar" class="notice" hidden></p>

<main id="thread" aria-live="polite"></main>

<footer>
  <form id="composer">
    <div id="attBar" hidden></div>
    <div class="composer-row">
      <button id="attachBtn" type="button" class="ghost" title="ファイルや画像を添付（画像・テキストファイル）">📎</button>
      <textarea id="input" rows="1" placeholder="メッセージを入力"></textarea>
      <select id="modelSelect" title="モデル"></select>
      <button id="sendBtn" type="submit" aria-label="送信">↑</button>
    </div>
    <input type="file" id="fileInput" hidden multiple accept="image/*,.txt,.md,.csv,.tsv,.json,.js,.ts,.jsx,.tsx,.html,.htm,.css,.py,.xml,.svg,.log,.yaml,.yml,.toml">
  </form>
</footer>

<dialog id="settings">
  <form method="dialog" class="settings-box">
    <h2>設定</h2>
    <label>Logfare APIキー
      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Logfareで発行されたキー">
    </label>
    <p class="hint"><button id="copyKeyBtn" type="button">📋 保存済みキーをコピー</button> <span id="copyKeyMsg"></span></p>
    <p class="hint">キーは <a href="https://logfare.ai/register" target="_blank" rel="noopener">logfare.ai/register</a> で発行できます。</p>
    <div>
      <div class="row" style="justify-content:flex-start">
        <button id="exportBtn" type="button" class="ghost">⬇ 書き出す</button>
        <button id="importBtn" type="button" class="ghost">⬆ 読み込む</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
      <p class="hint" id="syncMsg"></p>
    </div>
    <label><input id="autoUpgradeInput" type="checkbox" checked style="width:auto"> モデルを自動で最新に切り替える</label>
    <p class="hint">⚠️ Logfareに個人情報・秘密情報は送らないでください。</p>
    <div class="row">
      <button id="saveSettings" type="button">保存</button>
      <button value="cancel" type="submit" class="ghost">閉じる</button>
    </div>
  </form>
</dialog>

<dialog id="projectDlg">
  <form method="dialog" class="settings-box">
    <h3 style="margin:0">プロジェクト設定</h3>
    <label>プロジェクト名
      <input id="projName" type="text" placeholder="例：化粧品成分分析">
    </label>
    <label>指示
      <textarea id="projInstr" placeholder="このプロジェクトの会話に自動で適用される指示"></textarea>
    </label>
    <div class="row" style="justify-content:space-between">
      <button id="projDelete" type="button" class="ghost danger">プロジェクトを削除</button>
      <span style="display:flex;gap:8px">
        <button id="projSave" type="button">保存</button>
        <button id="projClose" type="button" class="ghost">閉じる</button>
      </span>
    </div>
  </form>
</dialog>

<script>
// ハチワレ チャット（Logfare版）
// - チャット / アプリ作成: POST https://logfare.ai/v1/chat/completions（ストリーミング）
// - 画像: POST https://logfare.ai/v1/images/generations（FLUX系モデル）
// - APIキーはこの端末の localStorage にだけ保存し、Logfare以外へは送りません。
"use strict";

const API = "https://logfare.ai/v1";
const LS_KEY = "hachiware-chat-state-v1";
const CAT_ICON = "icon-512.png";

/* チャットで使うのは上位モデルのみ（この順で表示）。既定は先頭のGLM 5.3 */
const TOP_CHAT_IDS = ["glm-5.3", "qwen-3.8-27b", "gemma-4-31b-it", "deepseek-v4.1-flash-1017"];
const FALLBACK_MODELS = {
  chat: [
    { id: "glm-5.3", label: "GLM 5.3" },
    { id: "qwen-3.8-27b", label: "Qwen 3.8 27B" },
    { id: "gemma-4-31b-it", label: "Gemma 4 31B IT" },
    { id: "deepseek-v4.1-flash-1017", label: "DeepSeek V4.1 Flash" },
  ],
  image: [
    { id: "flux-2-dev", label: "FLUX.2 Dev（高画質）" },
    { id: "flux-2-klein-9b", label: "FLUX.2 Klein 9B" },
    { id: "flux-1-schnell", label: "FLUX.1 Schnell（速い）" },
    { id: "sdxl-lightning", label: "SDXL Lightning（速い）" },
  ],
};

const SYSTEM_PROMPT =
  "あなたは親切な日本語アシスタントです。簡潔で正確に答えてください。" +
  "アプリやPWA、ツールを作ってほしいと頼まれたら、日本語で短く説明したあと、そのままブラウザで動く単一HTMLファイル全体（CSSとJavaScript込み）を1つのコードブロックで出力してください。データ保存が必要ならlocalStorageを使ってください。";

let models = structuredClone(FALLBACK_MODELS);
let state = {
  mode: "chat",
  apiKey: "",
  autoUpgrade: true,
  routeChoice: "auto",
  convs: null,
  projects: [],
  projectFilter: "all",
  modelChoice: { chat: "glm-5.3", image: "flux-2-dev" },
  ui: { chat: [], app: [], image: [] },
  history: { chat: [], app: [] },
};

try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (saved && saved.ui && saved.history) state = Object.assign(state, saved);
} catch (_) { /* 初回は既定値 */ }

const $ = (id) => document.getElementById(id);
const thread = $("thread");
const input = $("input");
const modelSelect = $("modelSelect");

function save() {
  try {
    const copy = structuredClone(state);
    for (const m of ["chat", "app", "image"]) {
      copy.ui[m] = copy.ui[m].map((it) =>
        it.imgUrl && it.imgUrl.startsWith("data:") && it.imgUrl.length > 200000
          ? { ...it, imgUrl: null, text: (it.text || "") + "\n（画像は端末に保存されませんでした）" }
          : it
      );
    }
    localStorage.setItem(LS_KEY, JSON.stringify(copy));
  } catch (_) { /* 容量超過時は保存を諦める */ }
}

/* ---------- 会話リスト（サイドチャット風） ----------
   state.ui[mode] / state.history[mode] は「今開いている会話」の置き場として従来どおり使い、
   convs[mode].list に全会話を持つ。開いている会話は参照を共有させる（linkActiveThreads）。 */
function genThreadId() {
  return "c" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
}
function migrateConvs(st) {
  if (!st.convs || typeof st.convs !== "object") st.convs = {};
  for (const m of ["chat", "app"]) {
    const c = st.convs[m];
    if (!c || !Array.isArray(c.list) || !c.list.length) {
      const has = ((st.ui && st.ui[m]) || []).length > 0;
      const t = {
        id: genThreadId(), title: has ? "これまでの会話" : "新しいチャット",
        createdAt: Date.now(), updatedAt: Date.now(),
        ui: (st.ui && st.ui[m]) || [], history: (st.history && st.history[m]) || [],
      };
      st.convs[m] = { activeId: t.id, list: [t] };
    }
  }
  return st;
}
/* モード廃止に伴う統合（1回だけ）: アプリ作成モードの会話をチャットへ移し、
   画像モードの履歴は「画像の履歴」という会話にする。会話の中身は消さない。 */
function unifyState(st) {
  if (st.unified) return st;
  const chat = st.convs && st.convs.chat;
  if (chat) {
    const app = st.convs.app;
    if (app && Array.isArray(app.list)) {
      const ids = new Set(chat.list.map((t) => t.id));
      for (const t of app.list) if (!ids.has(t.id)) chat.list.push(t);
      if (st.mode === "app" && app.activeId) chat.activeId = app.activeId;
    }
    delete st.convs.app;
    const imgs = (st.ui && st.ui.image) || [];
    if (imgs.length) {
      chat.list.push({
        id: genThreadId(), title: "画像の履歴",
        createdAt: Date.now(), updatedAt: Date.now(),
        ui: imgs, history: [], projectId: null,
      });
    }
  }
  if (st.ui) st.ui.image = [];
  if (st.ui) st.ui.app = [];
  if (st.history) st.history.app = [];
  st.mode = "chat";
  if (!st.modelChoice) st.modelChoice = {};
  if (!TOP_CHAT_IDS.includes(st.modelChoice.chat)) st.modelChoice.chat = "glm-5.3";
  if (!st.modelChoice.image) st.modelChoice.image = "flux-2-dev";
  st.unified = true;
  return st;
}
function linkActiveThreads() {
  const c = state.convs.chat;
  if (!c) return;
  const t = c.list.find((x) => x.id === c.activeId) || c.list[0];
  c.activeId = t.id;
  t.ui = state.ui.chat;
  t.history = state.history.chat;
}
function activeThread() {
  if (!state.convs || !state.convs.chat) return null;
  const c = state.convs.chat;
  return c.list.find((x) => x.id === c.activeId) || null;
}
function touchThread(userText) {
  const t = activeThread();
  if (!t) return;
  t.updatedAt = Date.now();

    t.title = String(userText).replace(/\s+/g, " ").slice(0, 24) || t.title;
  }

}
function switchThread(id) {
  const c = state.convs[state.mode];
  const t = c.list.find((x) => x.id === id);
  if (!t) return;
  c.activeId = id;
  state.ui[state.mode] = t.ui;
  state.history[state.mode] = t.history;
  save();
  renderThread();
  renderSidebar();
}
let searchQuery = "";
function renderSidebar() {
  const listEl = $("convList");

  renderProjects();
  const pr = state.projectFilter && state.projectFilter !== "all" && state.projectFilter !== "none"

  if (searchQuery) items = items.filter((t) => (t.title || "新しいチャット").toLowerCase().includes(searchQuery));
  for (const t of items) {

    row.appendChild(date);
    row.appendChild(del);

function deleteThread(id) {
  const c = state.convs[state.mode];
  const t = c.list.find((x) => x.id === id);
  if (!t) return;
  if (!confirm("会話「" + (t.title || "新しいチャット") + "」を削除しますか？")) return;
  if (c.list.length <= 1) {
    t.ui.length = 0;
    t.history.length = 0;
    t.title = "新しいチャット";
    t.updatedAt = Date.now();
    state.ui[state.mode] = t.ui;
    state.history[state.mode] = t.history;
  } else {
    c.list = c.list.filter((x) => x.id !== id);
    if (c.activeId === id) {
      const nt = [...c.list].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
      c.activeId = nt.id;
      state.ui[state.mode] = nt.ui;
      state.history[state.mode] = nt.history;
    }
  }
  save();
  renderThread();
  renderSidebar();
}

function buildExportData(st) {

        ? { ...it, imgUrl: null, text: (it.text || "") + "\n（画像データは書き出しに含まれません）" }
        : it
    );

function parseImportData(text) {

/* ---------- 描画（XSS対策として textContent ベースで組み立てる） ---------- */
function renderRich(container, text) {
  container.textContent = "";
  const parts = String(text || "").split(/```(\w*)\n?/);
  // parts: [text, lang, code, text, lang, code, ...] の繰り返しになる
  for (let i = 0; i < parts.length; i++) {
    if (i % 3 === 2) {
      const code = parts[i];
      const pre = document.createElement("pre");
      const codeEl = document.createElement("code");
      codeEl.textContent = code;
      pre.appendChild(codeEl);
      container.appendChild(pre);
      const dl = document.createElement("button");
      dl.type = "button";
      dl.className = "dl";
      dl.textContent = "⬇ このコードをファイルとして保存";
      dl.addEventListener("click", () => downloadCode(code));
      container.appendChild(dl);
    } else if (i % 3 === 0) {
      const span = document.createElement("span");
      span.textContent = parts[i];
      container.appendChild(span);
    }
  }
}

function downloadCode(code) {
  const isHtml = /<\s*html/i.test(code);
  const name = isHtml ? "index.html" : "code.txt";
  const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function addItem(who, text, imgUrl, extra) {
  const item = Object.assign({ who, text: text || "", imgUrl: imgUrl || null }, extra || {});
  state.ui[state.mode].push(item);
  drawItem(item);
  touchThread(who === "user" ? text : null);
  save();
  return item;
}

function drawItem(item) {
  const div = document.createElement("div");
  div.className = "msg " + (item.who === "user" ? "user" : item.who === "error" ? "error" : "assistant");
  const body = document.createElement("div");
  renderRich(body, item.text);
  div.appendChild(body);
  if ((item.attachImg && String(item.attachImg).startsWith("data:image/")) || (Array.isArray(item.fileNames) && item.fileNames.length)) {
    const wrap = document.createElement("div");
    wrap.className = "att-wrap";
    if (item.attachImg && String(item.attachImg).startsWith("data:image/")) {
      const im = document.createElement("img");
      im.className = "att-img";
      im.src = item.attachImg;
      im.alt = "添付画像";
      wrap.appendChild(im);
    }
    if (Array.isArray(item.fileNames)) {
      for (const n of item.fileNames) {
        const c = document.createElement("span");
        c.className = "att-chip";
        c.textContent = "📄 " + n;
        wrap.appendChild(c);
      }
    }
    body.insertBefore(wrap, body.firstChild);
  }
  if (item.imgUrl) {
    const img = document.createElement("img");
    img.className = "gen";
    img.src = item.imgUrl;
    img.alt = "生成された画像";
    div.appendChild(img);
    const a = document.createElement("a");

    a.download = "image.jpg";
    a.target = "_blank";
    a.rel = "noopener";

    div.appendChild(a);
  }
  if (item.handoff) {
    const ho = item.handoff;
    const mkBtn = (label, fn) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "dl";
      b.textContent = label;
      b.addEventListener("click", fn);
      div.appendChild(b);
    };
    mkBtn("📋 引き継ぎ文をコピー", async () => {
      let ok = false;
      try { await navigator.clipboard.writeText(ho.text); ok = true; } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = ho.text;
        document.body.appendChild(ta);
        ta.select();
        try { ok = document.execCommand("copy"); } catch (_) { /* noop */ }
        ta.remove();
      }
      alert(ok ? "コピーしました。行き先に貼ってください。" : "コピーに失敗しました。下の「ファイルとして保存」を使ってください。");
    });
    mkBtn("⬇ 引き継ぎ文をファイルとして保存", () => {
      const blob = new Blob([ho.text], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = ho.filename || "handoff.md";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    });
    if (ho.route === "claude") {
      const a = document.createElement("a");
      a.className = "dl";
      a.style.textDecoration = "none";
      a.textContent = "↗ Claudeを開く（引き継ぎ文が入力済み）";
      a.href = "https://claude.ai/new?q=" + encodeURIComponent(ho.text.slice(0, 6000));
      a.target = "_blank";
      a.rel = "noopener";
      div.appendChild(a);
    }
    if (ho.route === "dev") {
      const note = document.createElement("div");
      note.textContent = "使い方：ロクに送る場合はコピーしてそのまま貼ってください。OpenCodeで使う場合は、保存したファイルをプロジェクトで開いて内容を貼ってください。";
      div.appendChild(note);
    }
  }
  if (item.who === "user") {
    thread.appendChild(div);
  } else {
    const wrap = document.createElement("div");
    wrap.className = "row-wrap";

    av.className = "avatar";
    av.src = CAT_ICON;
    av.alt = "";
    wrap.appendChild(av);
    wrap.appendChild(div);
    thread.appendChild(wrap);
  }
  thread.scrollTop = thread.scrollHeight;
  return { div, body };
}

/* ---------- モデル一覧（キー不要で取得できる /v1/models を使用） ---------- */
async function loadModels() {
  try {
    const headers = {};
    const k = getKey();
    if (k) headers.Authorization = "Bearer " + k; // キー付きだと解放済みモデルも一覧に載る
    const res = await fetch(API + "/models", { headers });
    if (!res.ok) return;
    const data = (await res.json()).data || [];
    const toLabel = (m) => ({ id: m.id, label: m.display_name || m.id });
    const chat = data
      .filter((m) => (m.endpoints || []).includes("chat/completions"))
      .map(toLabel);
    const image = data
      .filter((m) => (m.endpoints || []).includes("images/generations"))
      .map(toLabel);
    if (chat.length) {
      // 上位モデルのみに絞る（TOP_CHAT_IDSの順で並べる）
      const top = TOP_CHAT_IDS.map((id) => chat.find((m) => m.id === id)).filter(Boolean);
      models.chat = top.length ? top : chat.slice(0, 4);
    }
    if (image.length) models.image = image;
  } catch (_) { /* 取得できなければ同梱の既定値を使う */ }
  autoUpgradeModels();
  fillModelSelect();
}

/* ---------- 自動切り替え（無料枠のみ・同じ系列の新しい版へ） ---------- */
function modelFamilyVersion(id) {
  const m = String(id).toLowerCase().match(/^([a-z]+)[^0-9]*(\d+)?(?:\.(\d+))?/);
  if (!m) return { family: String(id), major: 0, minor: 0 };
  return { family: m[1], major: Number(m[2] || 0), minor: Number(m[3] || 0) };
}
function autoUpgradeModels() {
  if (state.autoUpgrade === false) return;
  const notices = [];
  const apply = (modeKey, list, fallbackId) => {
    if (!list || !list.length) return;
    const cur = state.modelChoice[modeKey];
    const found = list.find((m) => m.id === cur);
    if (!found) {
      const next = list.find((m) => m.id === fallbackId) || list[0];
      if (next && next.id !== cur) {
        notices.push("「" + cur + "」は一覧から消えたため「" + next.id + "」に切り替えました");
        state.modelChoice[modeKey] = next.id;
      }
      return;
    }
    if (cur === "logfare/auto") return; // サーバー側ルーターは常に最新へ振り分けるので対象外
    const curV = modelFamilyVersion(cur);
    const newer = list
      .filter((m) => {
        const v = modelFamilyVersion(m.id);
        return v.family === curV.family &&
          (v.major > curV.major || (v.major === curV.major && v.minor > curV.minor));
      })
      .sort((a, b) => {
        const va = modelFamilyVersion(a.id), vb = modelFamilyVersion(b.id);
        return vb.major - va.major || vb.minor - va.minor;
      })[0];
    if (newer) {
      notices.push("新しい版が出たため「" + cur + "」→「" + newer.id + "」に切り替えました");
      state.modelChoice[modeKey] = newer.id;
    }
  };
  apply("chat", models.chat, "glm-5.3");
  apply("image", models.image, "flux-2-dev");
  if (notices.length) {
    const el = $("autoNotice");
    el.textContent = "🔄 モデルを自動で切り替えました：" + notices.join("／");
    el.hidden = false;
    save();
  }
}

function fillModelSelect() {
  const list = models.chat;
  modelSelect.textContent = "";
  for (const m of list) {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.label;
    modelSelect.appendChild(opt);
  }
  const want = state.modelChoice.chat;
  if (list.some((m) => m.id === want)) modelSelect.value = want;
}

/* ---------- 行き先の振り分け（ルーター） ----------
   この画面（単一HTML）から外部の道具を直接動かすことはできないため、
   振り分け先が Logfare 以外のときは送信を止め、行き先別の「引き継ぎ文」を作る。
   Claude は ?q= で入力済みの状態で開ける（送信は本人が Enter）。
   判定はこの端末内だけで行い、判定のために外部へ送ることはない。 */
function detectRoute(text) {
  const rules = [
    { route: "roku", kind: "secret", patterns: [
      /パスワード/, /APIキー/i, /秘密鍵/, /個人情報/, /クレジットカード/, /口座番号/, /マイナンバー/,
      /非公開の/, /全ソース/, /ソース全文/, /製品データ/, /sk-[A-Za-z0-9]{8,}/, /Bearer\s+\S+/,
    ], label: "秘密情報を含む可能性" },
    { route: "roku", kind: "action", patterns: [
      /メールを(送|確認|読|返信|チェック)/, /メールが(来|届)/, /Gmail/i,
      /カレンダーに(入|登録|追加)/, /予定を(入|登録|追加|確認)/, /リマインダー/,
      /Macを(操作|再起動)/, /Macの(画面|ファイル|容量)/, /ファイルを(削除|整理|移動)して/,
      /最新の(情報|ニュース|モデル|料金)/, /ニュースを(調べ|確認)/, /公式(サイト|情報)を(調べ|確認)/,
      /料金を調べ/, /価格を調べ/, /予約(を|して)/, /申し込んで/,
    ], label: "メール／カレンダー／Mac操作／最新情報の確認が必要" },
    { route: "dev", kind: "dev", patterns: [
      /npm/, /テストを(実行|回)/, /テスト実行/, /ビルド(して|を実行)/, /ファイルを(直|編集|修正)して/,
      /実装して/, /バグを(直|修正)/, /リファクタ/, /コミットして/, /デプロイして/, /エラーを直して/,
    ], label: "ファイルの直接編集やテスト実行が必要" },
    { route: "claude", kind: "finish", patterns: [
      /仕上げ(て|の)/, /最終確認/, /最終判断/, /推敲/, /校正して/, /厳密に/, /設計を(決め|判断)/, /設計レビュー/,
    ], label: "仕上げ・最終判断の依頼" },
  ];
  for (const rule of rules) {
    for (const p of rule.patterns) {
      const m = text.match(p);
      if (m) return { route: rule.route, kind: rule.kind, reason: rule.label + "（「" + m[0] + "」）" };
    }
  }
  return { route: "logfare", kind: "chat", reason: "" };
}

function buildHandoff(route, kind, reason, text) {
  const stamp = new Date().toLocaleString("ja-JP");
  if (route === "claude") {
    return {
      filename: "claude-handoff.md",
      text:
        "# Claudeへの仕上げ依頼\n\n次の素材について、厳密な設計判断と日本語の最終仕上げを行ってください。事実と推測を分け、根拠が弱い点は明示してください。量の下書きではなく、仕上げだけをお願いします。\n\n## 素材・依頼\n" + text + "\n",
    };
  }
  if (route === "dev") {
    return {
      filename: "dev-handoff.md",
      text:
        "# 開発依頼（OpenCode＋Logfare／ロク）\n\n## やりたいこと\n" + text + "\n\n## 条件\n- 対象が Formula Bloom（処方の花）の場合は、プロジェクトの AGENTS.md と handoff のルールを守ること\n- 変更後は必ずテスト（npm run check）を実行し、結果を報告すること\n- 非公開のソース全文や製品データJSONを Logfare へ送らないこと（渡してよいのは安全なコンテキスト＋対象ファイル1つまで）\n- 破壊的な変更（削除・リセット等）は事前に承認を取ること\n",
    };
  }
  // roku（メール・Mac・調べもの／秘密情報）
  const warn = kind === "secret"
    ? "⚠️ 秘密情報を含む可能性があるため、ハチワレチャット（Logfare）には送信していません。\n\n"
    : "";
  return {
    filename: "roku-handoff.md",
    text:
      warn + "# ロクへの依頼\n\n" + text + "\n\n## 備考\n- ハチワレチャットから切り替えた依頼です（" + stamp + "）。理由：" + reason + "\n- メール／カレンダー／Mac操作／最新情報の確認が必要な場合は、接続済みの道具で実行してください\n",
  };
}

const ROUTE_NAMES = {
  claude: "Claude（仕上げ）",
  dev: "開発（OpenCode＋Logfare／ロク）",
  roku: "ロク（メール・カレンダー・Mac・調べもの）",
};

function doHandoff(route, kind, reason, originalText) {
  const ho = buildHandoff(route, kind, reason, originalText);
  const item = {
    who: "assistant",
    text:
      "↪ 行き先を切り替えました：" + ROUTE_NAMES[route] + "\n理由：" + reason +
      "\nLogfareには送信していません。下の引き継ぎ文をコピー（または保存）して、行き先で使ってください。\n\n--- 引き継ぎ文 ---\n" + ho.text,
    imgUrl: null,
    handoff: { route, text: ho.text, filename: ho.filename },
  };
  state.ui[state.mode].push(item);
  drawItem(item);
  save();
}

/* ---------- API呼び出し ---------- */
function apiErrorMessage(status, serverMsg) {
  if (status === 401) {
    return (
      "APIキーが違うか、LogfareのDiscord連携が未完了のようです。「⚙️ 設定」でキーを確認してください。\nLogfare側の表示: " +
      (serverMsg || "")
    );
  }
  return "エラー（" + status + "）: " + (serverMsg || "不明なエラー");
}

async function sendChat(text, atts) {
  const mode = state.mode;
  const content = atts && atts.length ? buildUserContent(text, atts).content : text;
  state.history[mode].push({ role: "user", content });
  const messages = [
    { role: "system", content: buildSystemContent() },
    ...state.history[mode],
  ];
  const item = { who: "assistant", text: "", imgUrl: null };
  state.ui[mode].push(item);
  const { body } = drawItem(item);
  body.parentElement.classList.add("typing");

  try {
    const res = await fetch(API + "/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + getKey(),
      },
      body: JSON.stringify({
        model: state.modelChoice[mode],
        messages,
        stream: true,
      }),
    });
    if (!res.ok) {
      let msg = "";
      try {
        msg = (await res.json())?.error?.message || "";
      } catch (_) { /* noop */ }
      throw new Error(apiErrorMessage(res.status, msg));
    }
    const ct = res.headers.get("content-type") || "";
    if (ct.includes("application/json")) {
      const j = await res.json();
      item.text = j?.choices?.[0]?.message?.content || j?.choices?.[0]?.message?.reasoning_content || "（空の応答でした）";
    } else {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let reasoning = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith("data:")) continue;
          const payload = t.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const d = JSON.parse(payload)?.choices?.[0]?.delta || {};
            if (d.content) {
              item.text += d.content;
              renderRich(body, item.text);
              thread.scrollTop = thread.scrollHeight;
            } else if (d.reasoning_content) {
              reasoning += d.reasoning_content;
              if (!item.text) {
                renderRich(body, reasoning);
                thread.scrollTop = thread.scrollHeight;
              }
            }
          } catch (_) { /* 部分行は無視 */ }
        }
      }
      if (!item.text) item.text = reasoning || "（空の応答でした）";
    }
    if (item.text && item.text !== "（空の応答でした）") {
      state.history[mode].push({ role: "assistant", content: item.text });
    }
  } catch (e) {
    item.who = "error";
    item.text = e.message || String(e);
    state.history[mode].pop(); // 失敗した発言は履歴から外す
  } finally {
    body.parentElement.classList.remove("typing");
    body.parentElement.className = "msg " + (item.who === "error" ? "error" : "assistant");
    renderRich(body, item.text);
    save();
  }
}

/* 画像生成の言葉づかい判定（添付があるときは画像の質問として扱い、生成しない） */
function detectImageIntent(text, hasAtts) {
  if (hasAtts) return false;
  const t = String(text || "");
  if (/(作り方|方法|やり方|分析|読み取|翻訳|要約)/.test(t)) return false;
  if (/(画像|イラスト|絵|写真|ロゴ|アイコン|バナー|サムネイル|壁紙).{0,14}(作って|つくって|描いて|生成して|作成して|描いてください|作ってください)/.test(t)) return true;
  if (/(画像生成|イラスト生成|画像を作|画像を描)/.test(t)) return true;
  if (/^(draw|generate)\b.*\b(image|picture|illustration)/i.test(t)) return true;
  return false;
}
/* 画像サイズは言葉から推定する（既定は正方形） */
function sizeFromText(text) {
  const t = String(text || "");
  if (/サムネイル|note用/.test(t)) return "1280x670";
  if (/縦長/.test(t)) return "576x1024";
  if (/横長|ワイド/.test(t)) return "1024x576";
  if (/小さめ|小さい/.test(t)) return "512x512";
  return "1024x1024";
}

async function sendImage(prompt) {
  const item = { who: "assistant", text: "生成中です…（30秒ほどかかることがあります）", imgUrl: null };
  state.ui[state.mode].push(item);
  touchThread(prompt);
  const { div, body } = drawItem(item);
  div.classList.add("typing");
  try {
    const res = await fetch(API + "/images/generations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + getKey(),
      },
      body: JSON.stringify({
        model: state.modelChoice.image,
        prompt,
        size: sizeFromText(prompt),
        n: 1,
      }),
    });
    if (!res.ok) {
      let msg = "";
      try {
        msg = (await res.json())?.error?.message || "";
      } catch (_) { /* noop */ }
      throw new Error(apiErrorMessage(res.status, msg));
    }
    const j = await res.json();
    const d = j?.data?.[0] || {};
    const url = d.url || (d.b64_json ? "data:image/png;base64," + d.b64_json : null);
    if (!url) throw new Error("画像データが返りませんでした。別のモデルで試してください。");
    item.text = prompt;
    item.imgUrl = url;
  } catch (e) {
    item.who = "error";
    item.text = e.message || String(e);
  } finally {
    div.classList.remove("typing");
    div.className = "msg " + (item.who === "error" ? "error" : "assistant");
    body.textContent = "";
    renderRich(body, item.text);
    if (item.imgUrl) {
      const img = document.createElement("img");
      img.className = "gen";
      img.src = item.imgUrl;
      img.alt = "生成された画像";
      div.appendChild(img);
      const a = document.createElement("a");
      a.href = item.imgUrl;
      a.download = "image.png";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "画像を開く／保存";
      div.appendChild(a);
    }
    save();
  }
}

/* ---------- 添付ファイル（画像・テキストファイル） ---------- */
let pendingAtts = [];
const TEXT_EXTS = [".txt", ".md", ".csv", ".tsv", ".json", ".js", ".ts", ".jsx", ".tsx", ".html", ".htm", ".css", ".py", ".xml", ".svg", ".log", ".yaml", ".yml", ".toml"];
function attNotice(msg) {
  const n = $("autoNotice");
  n.hidden = false;
  n.textContent = msg;
}
function isTextFile(f) {
  return f.type.startsWith("text/") || f.type === "application/json" ||
    TEXT_EXTS.some((e) => f.name.toLowerCase().endsWith(e));
}
function downscaleImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1024;
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * sc));
      cv.height = Math.max(1, Math.round(img.height * sc));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}
async function addFiles(files) {
  for (const f of files) {
    if (pendingAtts.length >= 4) { attNotice("添付は1回に4つまでです"); break; }
    try {
      if (f.type.startsWith("image/")) {
        pendingAtts.push({ kind: "image", url: await downscaleImage(f), name: f.name });
      } else if (isTextFile(f)) {
        let t = await f.text();
        let truncated = false;
        if (t.length > 100000) { t = t.slice(0, 100000); truncated = true; }
        pendingAtts.push({ kind: "file", name: f.name, text: t, truncated });
      } else {
        attNotice("対応していないファイルです: " + f.name + "（画像とテキストファイルのみ添付できます）");
      }
    } catch (err) {
      attNotice(err.message || String(err));
    }
  }
  renderAttBar();
}
function renderAttBar() {
  const bar = $("attBar");
  bar.textContent = "";
  bar.hidden = pendingAtts.length === 0;
  pendingAtts.forEach((a, i) => {
    const d = document.createElement("div");
    d.className = "att-item";
    if (a.kind === "image") {
      const im = document.createElement("img");
      im.src = a.url;
      im.alt = "";
      d.appendChild(im);
    }
    const s = document.createElement("span");
    s.textContent = a.kind === "image" ? "🖼 " + (a.name || "画像") : "📄 " + a.name;
    d.appendChild(s);
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "✕";
    x.addEventListener("click", () => { pendingAtts.splice(i, 1); renderAttBar(); });
    d.appendChild(x);
    bar.appendChild(d);
  });
}
/* 添付つきユーザー発言の組み立て: テキストファイルは本文に埋め込み、画像はvision形式のパートにする */
function buildUserContent(text, atts) {
  let content = text;
  const fileNames = [];
  let attachImg = null;
  const files = atts.filter((a) => a.kind === "file");
  const imgs = atts.filter((a) => a.kind === "image");
  if (files.length) {
    const blocks = files.map((a) =>
      "【添付ファイル: " + a.name + (a.truncated ? "（長いため先頭10万字まで）" : "") + "】\n```\n" + a.text + "\n```");
    content = blocks.join("\n\n") + (text ? "\n\n" + text : "");
    for (const f of files) fileNames.push(f.name);
  }
  if (imgs.length) {
    attachImg = imgs[0].url;
    const parts = [];
    if (content) parts.push({ type: "text", text: content });
    for (const im of imgs) parts.push({ type: "image_url", image_url: { url: im.url } });
    content = parts;
  }
  return { content, attachImg, fileNames };
}

$("attachBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async (e) => {
  await addFiles([...e.target.files]);
  e.target.value = "";
});
input.addEventListener("paste", (e) => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});

/* ---------- イベント ---------- */
$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text && pendingAtts.length === 0) return;
  // 行き先の振り分け（自動のみ。振り分け先へはAPIキー不要）
  const det = detectRoute(text);
  if (det.route !== "logfare") {
    input.value = "";
    fitInput();
    addItem("user", text);
    doHandoff(det.route, det.kind, det.reason, text);
    if (pendingAtts.length) attNotice("行き先が変更されたため、添付ファイルはまだ送っていません（入力欄の下に残しています）");
    input.focus();
    return;
  }
  if (!getKey()) {
    $("settings").showModal();
    return;
  }
  input.value = "";
  fitInput();
  const atts = pendingAtts;
  pendingAtts = [];
  renderAttBar();
  const wantImage = detectImageIntent(text, atts.length > 0);
  const built = !wantImage && atts.length ? buildUserContent(text, atts) : null;
  addItem("user", text, null, built ? { attachImg: built.attachImg, fileNames: built.fileNames } : null);
  $("sendBtn").disabled = true;
  try {
    if (wantImage) await sendImage(text);
    else await sendChat(text, atts);
  } finally {
    $("sendBtn").disabled = false;
    input.focus();
  }
});

/* 入力に合わせて折り返して伸ばす（1行→最大140pxまで。超えた分だけスクロール） */
function fitInput() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}
input.addEventListener("input", fitInput);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

  save();
});

});

  state.apiKey = $("apiKeyInput").value.trim();

  updateKeyNotice();

  const key = $("apiKeyInput").value.trim();
  const msg = $("copyKeyMsg");
  if (!key) { msg.textContent = "キーが保存されていません"; return; }
  try {
    await navigator.clipboard.writeText(key);
    msg.textContent = "コピーしました（" + key.length + "文字）";
  } catch (e) {
    const inp = $("apiKeyInput");
    const orig = inp.type;
    inp.type = "text";
    inp.select();
    let okCopy = false;
    try { okCopy = document.execCommand("copy"); } catch (e2) {}
    inp.type = orig;
    msg.textContent = okCopy ? "コピーしました（" + key.length + "文字）" : "コピーに失敗しました";
  }
});

$("exportBtn").addEventListener("click", () => {
  const data = buildExportData(state);
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const name = "hachiware-chat-backup-" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()) + ".json";
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  $("syncMsg").textContent = "書き出しました：" + name + "（APIキーは含まれていません）";
});

    state = Object.assign(
      { mode: "chat", autoUpgrade: true, routeChoice: "auto",

    );

    migrateConvs(state);

    migrateProjects(state);
    linkActiveThreads();
    save();

    renderSidebar();

  } catch (e) {
    $("syncMsg").textContent = "読み込めませんでした：" + (e.message || String(e));

});

  state.projects = state.projects.filter((x) => x.id !== p.id);
  for (const t of state.convs.chat.list) if (t.projectId === p.id) t.projectId = null;
  if (state.projectFilter === p.id) state.projectFilter = "all";
  save();

  updateProjBar();
  $("projectDlg").close();
});
